<VirtualHost *:80>
    ServerName china2026.proskurnin.com
    DocumentRoot /var/www/china2026.proskurnin.com/current
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    <Directory /var/www/china2026.proskurnin.com/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/china2026-error.log
    CustomLog ${APACHE_LOG_DIR}/china2026-access.log combined
</VirtualHost>
